<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImageSeeker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>ImageSeeker</h1>
      <button id="resetBtn" type="button">Reset Chat</button>
    </header>

    <section id="chat" class="chat-log" aria-live="polite"></section>

    <form id="chatForm" class="composer">
      <label id="dropZone" class="upload drop-zone" for="imageInput">
        <input id="imageInput" type="file" name="image" accept="image/*" />
        <span id="dropHint">Drag and drop an image here, or click to attach</span>
      </label>

      <textarea id="messageInput" name="message" rows="3" placeholder="Ask about your image..." ></textarea>

      <div class="composer-row">
        <small id="fileLabel">No image selected</small>
        <button id="sendBtn" type="submit">Send</button>
      </div>
    </form>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
